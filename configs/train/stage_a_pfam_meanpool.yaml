seed: 42
device: cuda:0
output_dir: outputs/pfam_meanpool
data:
  manifest_path: data/interim/manifests/pfam_manifest.csv
  pair_path: data/processed/pfam/pfam_pairs_sub_v2.csv
  sequence_column: sequence
  negatives_per_query: 15
model:
  config_path: configs/model/esm2_meanpool.yaml
training:
  epochs: 3
  batch_size: 16
  grad_accum_steps: 2
  gpu_ids: [0, 1]
  learning_rate: 1.0e-4
  weight_decay: 0.05
  num_workers: 8
  bf16: false
  max_grad_norm: 1.0
  log_interval: 100
  eval_interval_steps: 500
  eval_subsample_queries: 2000
  early_stop_patience: 3
  save_name: pfam_meanpool_best.pt
