seed: 13
device: cuda
output_dir: outputs
data:
  manifest_path: data/interim/manifests/screen_manifest.csv
  pair_path: data/processed/stage_a/stage_a_pairs.csv
  sequence_column: sequence_1024
  negatives_per_query: 15
model:
  config_path: configs/model/dnabert2_colbert.yaml
training:
  epochs: 3
  batch_size: 8
  grad_accum_steps: 4
  learning_rate: 2.0e-4
  weight_decay: 0.01
  num_workers: 0
  bf16: true
  max_grad_norm: 1.0
  eval_every_steps: 100
  save_name: stage_a_best.pt

