seed: 42
device: cuda:0
output_dir: outputs/esm2_smoke
data:
  manifest_path: data/interim/manifests/scope_manifest.csv
  pair_path: data/processed/scope/scope_pairs.csv
  sequence_column: sequence
  negatives_per_query: 6
model:
  config_path: configs/model/esm2_colbert_small.yaml
training:
  epochs: 1
  batch_size: 8
  grad_accum_steps: 1
  gpu_ids: [0]
  learning_rate: 1.0e-4
  weight_decay: 0.01
  num_workers: 4
  bf16: false
  max_grad_norm: 1.0
  log_interval: 20
  save_name: esm2_smoke_best.pt
