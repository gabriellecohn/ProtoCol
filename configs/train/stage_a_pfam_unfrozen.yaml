seed: 42
device: cuda:0
output_dir: outputs/pfam_colbert_unfrozen
data:
  manifest_path: data/interim/manifests/pfam_manifest.csv
  pair_path: data/processed/pfam/pfam_pairs.csv
  sequence_column: sequence
  negatives_per_query: 6
model:
  config_path: configs/model/esm2_colbert_unfrozen.yaml
training:
  epochs: 5
  batch_size: 4
  grad_accum_steps: 12
  gpu_ids: [0, 1]
  learning_rate: 5.0e-5
  weight_decay: 0.01
  num_workers: 8
  bf16: false
  max_grad_norm: 1.0
  log_interval: 50
  save_name: pfam_colbert_unfrozen_best.pt
