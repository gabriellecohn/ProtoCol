[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dna-colbert-mvp"
version = "0.1.0"
description = "MVP cCRE retrieval pipeline with DNABERT-2 baselines and ColBERT late interaction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0.0",
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "scipy>=1.10.0",
  "scikit-learn>=1.3.0",
  "h5py>=3.9.0",
  "pyfaidx>=0.7.0",
  "pyranges>=0.0.129",
  "tqdm>=4.65.0",
  "matplotlib>=3.7.0",
  "seaborn>=0.12.0",
  "PyYAML>=6.0.1",
  "transformers>=4.39.0",
  "peft>=0.10.0",
]

[tool.setuptools.packages.find]
include = ["src*"]

